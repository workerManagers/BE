# ================ 애플리케이션 기본 설정 ================
spring:
  application:
    name: workerManagers  # 애플리케이션 이름 설정 (모니터링 용이)

  config:
    import: optional:file:.env[.properties]  # 환경 변수 파일 로드 설정

  datasource:
    url: jdbc:mysql://localhost:3306/workerManagers?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: 1234
    #password: 8190
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# ================ JWT 설정 ================
jwt:
  secret: your-secret-key-should-be-very-long-and-secure-at-least-256-bits
  token-validity-in-seconds: 3600  # 1시간