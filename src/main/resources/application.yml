spring:
  config:
    import: 
      - optional:file:.env[.properties]
      - optional:file:application-${spring.profiles.active}.yml
  profiles:
    active: prod
  mvc:
    async:
      request-timeout: 600000  # 10분

server:
  connection-timeout: 600000  # 10분
  servlet:
    session:
      timeout: 30m   # 세션 타임아웃 (30분)
  tomcat:
    max-http-form-post-size: 20MB
    max-swallow-size: 20MB
    max-connections: 8192
    accept-count: 100
    max-threads: 200
    min-spare-threads: 10
  forward-headers-strategy: native
