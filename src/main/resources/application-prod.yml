# ================ 애플리케이션 기본 설정 ================
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

# ================ JWT 설정 ================
jwt:
  secret: ${JWT_SECRET:jwtsecretkeyforworkermanagers2024abcd1234}
  token-validity-in-seconds: ${JWT_TOKEN_VALIDITY_IN_SECONDS:3600}

# ================ 로깅 설정 ================
logging:
  level:
    root: INFO
    com.example.workerManagers: INFO
    org.springframework.security: INFO
  file:
    name: logs/application.log
