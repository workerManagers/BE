# ================ 애플리케이션 기본 설정 ================
spring:
  application:
    name: workerManagers  # 애플리케이션 이름 설정 (모니터링 용이)

  datasource:
    url: jdbc:mysql://localhost:3306/workerManagers?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    #password: 1234
    password: 8190
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# ================ JWT 설정 ================
jwt:
  secret: your-secret-key-should-be-very-long-and-secure-at-least-256-bits
  token-validity-in-seconds: 3600  # 1시간

# ================ 로깅 설정 ================
logging:
  level:
    root: INFO
    com.example.workerManagers: INFO
    com.example.workerManagers.domain.users.controller: INFO
    com.example.workerManagers.domain.users.service: INFO
    com.example.workerManagers.global.security: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO
    org.springframework.web.servlet.DispatcherServlet: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}  # 개발 환경에서는 dev 프로파일 사용
